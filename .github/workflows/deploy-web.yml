# Deploy the web frontend to GitHub Pages (manual only).
#
# Run it from Actions → "Deploy web to Pages" → Run workflow. Builds the
# browser shell (`dist/`, sample data + Settings → Data for broker creds —
# the runner has no .env, so no secrets are baked in) and publishes it to
# https://<owner>.github.io/<repo>/ (project site, so the base is derived
# from the repository name).
#
# NOTE: this takes over the repo's Pages site. Upstream serves its docs/
# website from Pages; on a fork that is fine, on upstream main it would
# replace the docs site — keep this workflow on branches that ship the app.
name: Deploy web to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      # Fresh checkouts have no generated src/bindings.ts (gitignored,
      # emitted by tauri-specta on Rust builds). Web-only builds use the
      # tracked fallback instead; real Tauri builds are untouched.
      - name: Fallback bindings for web-only build
        run: if [ ! -f src/bindings.ts ]; then cp src/bindings-fallback.ts src/bindings.ts; fi

      # Fresh checkouts lack the sibling drawing-core repo that
      # vite.config.ts aliases to ../lightweight-charts-drawing (also
      # gitignored-by-absence, like src/bindings.ts above). Clone it at the
      # same ref the release workflow pins. Since the release automation
      # (upstream cherry-pick 8756cb9) the pin lives in package.json's
      # config.drawingRef (kept current by scripts/release-bump.mjs) —
      # release.yml no longer carries a DRAWING_REF: env line.
      - name: Checkout drawing core
        run: |
          REF=$(node -p "require('./package.json').config.drawingRef")
          git clone --depth 1 --branch "$REF" https://github.com/deepentropy/lightweight-charts-drawing.git ../lightweight-charts-drawing

      - name: Build web bundle
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
